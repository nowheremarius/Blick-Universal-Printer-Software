name: Build Windows release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and check executable
        shell: pwsh
        run: |
          Remove-Item Blick.exe -ErrorAction SilentlyContinue
          cmd /c 'build.bat <nul'
          if (!(Test-Path Blick.exe)) { throw 'Build did not produce Blick.exe' }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path Blick.exe).Path)
          if ($assembly.Name -ne 'Blick') { throw 'Unexpected assembly name' }
      - name: Check failed writes, rescans and OCR timeout
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /codepage:65001 /target:exe /out:ReleaseChecks.exe /main:Blick.ReleaseChecks /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:Microsoft.VisualBasic.dll Theme.cs Controls.cs Preview.cs Imaging.cs Scan.cs MainForm.cs ".\tests\ReleaseChecks.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ReleaseChecks.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release version' }
          $notes = "docs/releases/$tag.md"
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create $tag ./Blick.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Blick $tag" @notesArgs
